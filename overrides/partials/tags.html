{% if tags %}
  <nav class="md-tags" {% if page.meta.hide and "tags" in page.meta.hide %}hidden{% endif %}>
    {% for tag in tags | sort(attribute="name") %}
      {% if tag.url %}
        <a href="{{ tag.url | url }}" class="md-tag">{{ tag.name }}</a>
      {% else %}
        <span class="md-tag">{{ tag.name }}</span>
      {% endif %}
    {% endfor %}
  </nav>
{% endif %}
